name: Validate extension and public list

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Keep the runner OS compatible with the pinned Playwright test browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate extension files and script syntax
        run: node scripts/check.mjs
      - name: Validate public subscription file
        run: node scripts/validate-list.mjs lists/guga-blocklist.json
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm run test:unit
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Run required browser fixtures
        run: npm run test:browser
